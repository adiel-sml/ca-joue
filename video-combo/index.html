<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Film de lancement</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fonts/projet.css">
<style>
  html, body { margin: 0; overflow: hidden; background: #26264A; }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="frameClip"><rect width="1080" height="1920"/></clipPath></defs>
  <g clip-path="url(#frameClip)">
    <g id="world"></g>
    <g id="hud"></g>
    <rect id="flash" width="1080" height="1920" fill="#FFFFFF" opacity="0"/>
  </g>
</svg>
<script src="timeline.js"></script>
<script src="assets/games.js"></script>
<script src="palette.js"></script>
<script src="engine.js"></script>
<script>{ const s = document.getElementById('stage'); s.setAttribute('viewBox', `0 0 ${VW} ${VH}`); s.setAttribute('width', VW); s.setAttribute('height', VH);
  for (const r of document.querySelectorAll('#frameClip rect, #flash')) { r.setAttribute('width', VW); r.setAttribute('height', VH); } }</script>
<script src="cast.js"></script>
<script src="people.js"></script>
<script src="story.js"></script>
<script src="acting.js"></script>
<script src="assets/ui/ui.js"></script>
<script src="motion.js"></script>
<script src="runtime.js"></script>
<script src="cine.js"></script>
<script>
(async () => {
  const PF = (window.PALETTE && PALETTE.polices) ? [`400 60px "${PALETTE.polices.titre}"`, `800 60px "${PALETTE.polices.texte}"`, `600 40px "${PALETTE.polices.texte}"`] : [];
  await Promise.all(['700 60px Fredoka', '600 50px Fredoka', '800 60px Inter', '500 40px Inter', ...PF].map(f => document.fonts.load(f, 'Ça Joue ?é')));
  await document.fonts.ready;
  await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'film.js'; s.onload = ok; s.onerror = ko; document.body.appendChild(s); });
  for (let t = 0; t < window.DUR; t += 1 / 24) window.render(t);     // crée toutes les images d'écran
  await Promise.all(LOADS);
  const q = new URLSearchParams(location.search);
  window.render(q.has('t') ? +q.get('t') : 0);
  window.READY = true;
})();
</script>
</body>
</html>
